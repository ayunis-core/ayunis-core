version: 2
updates:
  # pnpm workspace: a single root entry covers every workspace package
  # (backend, frontend, packages/*, e2e). Dependabot can only update the
  # shared root pnpm-lock.yaml from the directory that contains it, so
  # per-package entries produce PRs that fail `pnpm install --frozen-lockfile`.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    ignore:
      # The undici major MUST match the one Node embeds: undici 8 dropped the
      # legacy dispatcher handler API, so McpOAuthFetchService's Agent only
      # works as a `dispatcher` for globalThis.fetch when the majors agree.
      # node:24 embeds undici 7, node:26 embeds undici 8.10.2 — so this pin
      # moves in lockstep with the node image, in either direction. See the
      # docker `node` ignore below.
      - dependency-name: "undici"
        update-types: ["version-update:semver-major"]
    groups:
      nest:
        patterns:
          - "@nestjs/*"
          - "nestjs-*"
          - "@nestjs-cls/*"
        update-types:
          - "minor"
          - "patch"
      typescript:
        patterns:
          - "typescript"
          - "ts-*"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "jest"
          - "@jest/*"
          - "supertest"
          - "vitest"
          - "@playwright/*"
        update-types:
          - "minor"
          - "patch"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
        update-types:
          - "minor"
          - "patch"
      tanstack:
        patterns:
          - "@tanstack/*"
        update-types:
          - "minor"
          - "patch"
      radix:
        patterns:
          - "@radix-ui/*"
        update-types:
          - "minor"
          - "patch"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
        update-types:
          - "minor"
          - "patch"
      other:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Anonymize service (Python/uv)
  - package-ecosystem: "uv"
    directory: "/ayunis-core-anonymize"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps-anonymize)"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5

  # Code execution service (Python)
  - package-ecosystem: "pip"
    directory: "/ayunis-core-code-execution"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps-code-execution)"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5

  # Python sandbox image (libraries available to user-submitted code)
  - package-ecosystem: "pip"
    directory: "/ayunis-core-code-execution/sandbox"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps-sandbox)"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps-docker)"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # node:26 caused severe request slowness (connection stalls); runtime is
      # pinned to 24.16.0-alpine. Do not remove without re-validating — see AYC-423.
      # Moving to node:26 also requires bumping undici to 8 in the same change
      # (node:26 embeds undici 8.10.2); leaving undici on 7 breaks every MCP
      # OAuth request with "invalid onRequestStart method".
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker-images:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/ayunis-core-anonymize"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps-docker)"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/ayunis-core-code-execution"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps-docker)"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/ayunis-core-code-execution/sandbox"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps-docker)"
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps-actions)"
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
