version: 2
updates:
  # pnpm workspace: a single root entry covers every workspace package
  # (backend, frontend, packages/*, e2e). Dependabot can only update the
  # shared root pnpm-lock.yaml from the directory that contains it, so
  # per-package entries produce PRs that fail `pnpm install --frozen-lockfile`.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    groups:
      nest:
        patterns:
          - "@nestjs/*"
          - "nestjs-*"
          - "@nestjs-cls/*"
        update-types:
          - "minor"
          - "patch"
      typescript:
        patterns:
          - "typescript"
          - "ts-*"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "jest"
          - "@jest/*"
          - "supertest"
          - "vitest"
          - "@playwright/*"
        update-types:
          - "minor"
          - "patch"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
        update-types:
          - "minor"
          - "patch"
      tanstack:
        patterns:
          - "@tanstack/*"
        update-types:
          - "minor"
          - "patch"
      radix:
        patterns:
          - "@radix-ui/*"
        update-types:
          - "minor"
          - "patch"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
        update-types:
          - "minor"
          - "patch"
      other:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Anonymize service (Python/uv)
  - package-ecosystem: "uv"
    directory: "/ayunis-core-anonymize"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps-anonymize)"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5

  # Code execution service (Python)
  - package-ecosystem: "pip"
    directory: "/ayunis-core-code-execution"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps-code-execution)"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5

  # Python sandbox image (libraries available to user-submitted code)
  - package-ecosystem: "pip"
    directory: "/ayunis-core-code-execution/sandbox"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps-sandbox)"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps-docker)"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # node:26 caused severe request slowness (connection stalls); runtime is
      # pinned to 24.16.0-alpine. Do not remove without re-validating — see AYC-423.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker-images:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/ayunis-core-anonymize"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps-docker)"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/ayunis-core-code-execution"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps-docker)"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/ayunis-core-code-execution/sandbox"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps-docker)"
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps-actions)"
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
