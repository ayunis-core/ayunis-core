name: Agent Runtime

on:
  pull_request:
    paths:
      - 'packages/agent-runtime/**'
      - '.github/workflows/agent-runtime.yml'
      - '.github/actions/setup-node-pnpm/action.yml'
  push:
    branches: [main]
    paths:
      - 'packages/agent-runtime/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/agent-runtime

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      # Workspace deps (e.g. @ayunis/inference) resolve via their built `dist`,
      # which `pnpm install` does not produce — build the dep closure first.
      - name: Build workspace dependencies
        run: pnpm --filter "@ayunis/agent-runtime^..." build

      - name: Run TypeScript type check
        run: pnpm run typecheck

      - name: Run linter
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Check circular dependencies
        run: pnpm run deps:check
