name: Deploy Script Tests

on:
  pull_request:
    paths:
      - 'scripts/deploy-core-images.sh'
      - 'scripts/deploy-core-images.test.sh'
      - '.github/workflows/deploy-*.yml'
      - '.github/workflows/release-please.yml'
      - '.github/workflows/production-release.yml'
      - 'scripts/production-release*'
  push:
    branches: [main]
    paths:
      - 'scripts/deploy-core-images.sh'
      - 'scripts/deploy-core-images.test.sh'
      - '.github/workflows/deploy-*.yml'
      - '.github/workflows/release-please.yml'
      - '.github/workflows/production-release.yml'
      - 'scripts/production-release*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test deploy behavior
        run: bash scripts/deploy-core-images.test.sh

      - name: Test production release reporting
        run: python3 scripts/production-release.test.py
