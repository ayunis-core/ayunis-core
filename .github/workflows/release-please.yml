name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      body: ${{ steps.release.outputs.body }}
      html_url: ${{ steps.release.outputs.html_url }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Tags created with GITHUB_TOKEN don't trigger push-tag workflows, so the
  # image build is invoked explicitly. Since AYC-589 the deploys below pull
  # these images, so this has to be a real dependency: a reusable-workflow
  # call, not the fire-and-forget dispatch it used to be. secrets: inherit is
  # required — build-images' notify-infra job mints the ayunis-infra app token.
  build-release-images:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    uses: ./.github/workflows/build-images.yml
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: read
      packages: write
    secrets: inherit

  deploy-internal:
    needs: [release-please, build-release-images]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    environment: internal
    concurrency:
      group: deploy-internal
      cancel-in-progress: false
    steps:
      - name: Deploy to Internal
        uses: appleboy/ssh-action@v1.2.5
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        with:
          host: ${{ secrets.INTERNAL_HOST }}
          username: ${{ secrets.INTERNAL_USER }}
          key: ${{ secrets.INTERNAL_SSH_KEY }}
          envs: RELEASE_TAG
          script_stop: true
          script: |
            cd /home/ayunis/apps/ayunis-core
            # The checkout still supplies the compose files, the .env files and
            # postgres/init.sql — only the build is gone (AYC-589).
            git fetch --all --tags
            git checkout -f "$RELEASE_TAG"
            export COMPOSE_FILE=docker-compose.yml:compose.release.yml
            export CORE_TAG="$RELEASE_TAG"
            # Pull while the old containers still serve traffic, and abort
            # BEFORE touching them if anything is missing. Scoped to the Core
            # services: a bare `compose pull` would also refresh
            # minio/dozzle/redis/gotenberg, which are deliberately only pulled
            # when first started.
            if ! docker compose pull app code-execution anonymize; then
              echo "::error::image pull failed — keeping current containers, not deploying"
              exit 1
            fi
            # The sandbox is not a compose service; code-execution pulls it
            # through the docker-socket-proxy on first use. Pulling it here
            # keeps that first execution fast and proves the tag exists.
            if ! docker pull "ghcr.io/ayunis-core/ayunis-core-python-sandbox:$CORE_TAG"; then
              echo "::error::sandbox image pull failed — keeping current containers, not deploying"
              exit 1
            fi
            # Quick swap — downtime is only the restart
            docker compose down
            docker compose up -d --no-build
            # Wait for app to be healthy (up to 120s)
            timeout 120 bash -c 'until docker compose ps app --format json | grep -q "(healthy)"; do sleep 5; done'
            docker compose ps
            # Pulled images are tagged, not dangling, so the old `prune -f`
            # would never reclaim them. The cut-off keeps ~14 days of rollback
            # material; images in use by the running containers are never
            # removed.
            docker image prune -af --filter "until=336h"

  deploy-production:
    needs: [release-please, build-release-images, deploy-internal]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy to Production
        uses: appleboy/ssh-action@v1.2.5
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          envs: RELEASE_TAG
          script_stop: true
          script: |
            cd /home/ayunis/apps/ayunis-core
            # The checkout still supplies the compose files, the .env files and
            # postgres/init.sql — only the build is gone (AYC-589).
            git fetch --all --tags
            git checkout -f "$RELEASE_TAG"
            export COMPOSE_FILE=docker-compose.yml:compose.release.yml
            export CORE_TAG="$RELEASE_TAG"
            # Pull while the old containers still serve traffic, and abort
            # BEFORE touching them if anything is missing. Scoped to the Core
            # services: a bare `compose pull` would also refresh
            # minio/dozzle/redis/gotenberg, which are deliberately only pulled
            # when first started.
            if ! docker compose pull app code-execution anonymize; then
              echo "::error::image pull failed — keeping current containers, not deploying"
              exit 1
            fi
            # The sandbox is not a compose service; code-execution pulls it
            # through the docker-socket-proxy on first use. Pulling it here
            # keeps that first execution fast and proves the tag exists.
            if ! docker pull "ghcr.io/ayunis-core/ayunis-core-python-sandbox:$CORE_TAG"; then
              echo "::error::sandbox image pull failed — keeping current containers, not deploying"
              exit 1
            fi
            # Quick swap — downtime is only the restart
            docker compose down
            docker compose up -d --no-build
            # Wait for app to be healthy (up to 120s)
            timeout 120 bash -c 'until docker compose ps app --format json | grep -q "(healthy)"; do sleep 5; done'
            docker compose ps
            # Pulled images are tagged, not dangling, so the old `prune -f`
            # would never reclaim them. The cut-off keeps ~14 days of rollback
            # material; images in use by the running containers are never
            # removed.
            docker image prune -af --filter "until=336h"

  notify-slack:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [release-please, deploy-internal, deploy-production]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    steps:
      - name: Post to Slack
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          BODY: ${{ needs.release-please.outputs.body }}
          HTML_URL: ${{ needs.release-please.outputs.html_url }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # Convert GitHub Markdown to Slack mrkdwn format
          SLACK_BODY=$(echo "$BODY" | \
            # Remove the version header line (## [x.x.x](url) (date)) - we show this in the header already
            sed '/^## \[/d' | \
            # Convert ### headers to bold
            sed 's/^### \(.*\)/*\1*/g' | \
            # Convert markdown links [text](url) to Slack format <url|text>
            sed 's/\[\([^]]*\)\](\([^)]*\))/<\2|\1>/g' | \
            # Convert **bold** (GitHub Markdown) to *bold* (Slack mrkdwn)
            sed 's/\*\*\([^*]*\)\*\*/\*\1\*/g' | \
            # Convert bullet points to proper bullets
            sed 's/^\* /• /g' | \
            # Remove empty lines at the start
            sed '/./,$!d')

          # Fallback if body is empty after processing
          if [ -z "$SLACK_BODY" ]; then
            SLACK_BODY="No changelog entries."
          fi

          # Truncate if exceeding Slack's 3000 char limit for section blocks
          if [ ${#SLACK_BODY} -gt 2900 ]; then
            SLACK_BODY="${SLACK_BODY:0:2900}..."
          fi

          # Build JSON payload using jq (properly escapes all special characters)
          PAYLOAD=$(jq -n \
            --arg tag "$TAG_NAME" \
            --arg body "$SLACK_BODY" \
            --arg url "$HTML_URL" \
            '{
              blocks: [
                {
                  type: "header",
                  text: {
                    type: "plain_text",
                    text: "🎉 Ayunis Core \($tag) deployed"
                  }
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: $body
                  }
                },
                {
                  type: "actions",
                  elements: [
                    {
                      type: "button",
                      text: {
                        type: "plain_text",
                        text: "View Release"
                      },
                      url: $url
                    }
                  ]
                }
              ]
            }')

          curl -sfS -X POST \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"

  trigger-docs-update:
    name: Trigger Docs Update
    runs-on: ubuntu-latest
    needs: [release-please, deploy-production]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    steps:
      - name: Trigger docs update workflow
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DOCS_REPO_PAT }}
          repository: ayunis-core/ayunis-core-docs
          event-type: release-published

  linear-release:
    name: Linear Release
    runs-on: ubuntu-latest
    needs: [release-please, deploy-internal, deploy-production]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: linear/linear-release-action@v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          name: ${{ needs.release-please.outputs.tag_name }}
          version: ${{ needs.release-please.outputs.tag_name }}
