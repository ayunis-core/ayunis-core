name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      body: ${{ steps.release.outputs.body }}
      html_url: ${{ steps.release.outputs.html_url }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Tags created with GITHUB_TOKEN don't trigger push-tag workflows, so the
  # image build is invoked explicitly. Production is deployed from ayunis-infra
  # (Renovate bumps the image pin once notify-infra fires), so the jobs below
  # wait for the images to exist. secrets: inherit is required — build-images'
  # notify-infra job mints the ayunis-infra app token.
  build-release-images:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    uses: ./.github/workflows/build-images.yml
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: read
      packages: write
    secrets: inherit

  notify-slack:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [release-please, build-release-images]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    steps:
      - name: Post to Slack
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          BODY: ${{ needs.release-please.outputs.body }}
          HTML_URL: ${{ needs.release-please.outputs.html_url }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # Convert GitHub Markdown to Slack mrkdwn format
          SLACK_BODY=$(echo "$BODY" | \
            # Remove the version header line (## [x.x.x](url) (date)) - we show this in the header already
            sed '/^## \[/d' | \
            # Convert ### headers to bold
            sed 's/^### \(.*\)/*\1*/g' | \
            # Convert markdown links [text](url) to Slack format <url|text>
            sed 's/\[\([^]]*\)\](\([^)]*\))/<\2|\1>/g' | \
            # Convert **bold** (GitHub Markdown) to *bold* (Slack mrkdwn)
            sed 's/\*\*\([^*]*\)\*\*/\*\1\*/g' | \
            # Convert bullet points to proper bullets
            sed 's/^\* /• /g' | \
            # Remove empty lines at the start
            sed '/./,$!d')

          # Fallback if body is empty after processing
          if [ -z "$SLACK_BODY" ]; then
            SLACK_BODY="No changelog entries."
          fi

          # Truncate if exceeding Slack's 3000 char limit for section blocks
          if [ ${#SLACK_BODY} -gt 2900 ]; then
            SLACK_BODY="${SLACK_BODY:0:2900}..."
          fi

          # Build JSON payload using jq (properly escapes all special characters)
          PAYLOAD=$(jq -n \
            --arg tag "$TAG_NAME" \
            --arg body "$SLACK_BODY" \
            --arg url "$HTML_URL" \
            '{
              blocks: [
                {
                  type: "header",
                  text: {
                    type: "plain_text",
                    text: "🎉 Ayunis Core \($tag) released"
                  }
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: $body
                  }
                },
                {
                  type: "actions",
                  elements: [
                    {
                      type: "button",
                      text: {
                        type: "plain_text",
                        text: "View Release"
                      },
                      url: $url
                    }
                  ]
                }
              ]
            }')

          curl -sfS -X POST \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"

  trigger-docs-update:
    name: Trigger Docs Update
    runs-on: ubuntu-latest
    needs: [release-please, build-release-images]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    steps:
      - name: Trigger docs update workflow
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DOCS_REPO_PAT }}
          repository: ayunis-core/ayunis-core-docs
          event-type: release-published

  linear-release:
    name: Linear Release
    runs-on: ubuntu-latest
    needs: [release-please, build-release-images]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: linear/linear-release-action@v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          name: ${{ needs.release-please.outputs.tag_name }}
          version: ${{ needs.release-please.outputs.tag_name }}
