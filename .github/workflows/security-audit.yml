name: Security Audit

on:
  pull_request:
    paths:
      - 'pnpm-lock.yaml'
      # Root manifest: the `pnpm install --frozen-lockfile` step below also
      # acts as a lockfile-integrity gate. Triggering on package.json catches
      # root-manifest changes that don't touch pnpm-lock.yaml — e.g. a
      # dependency bump that drops pnpm.overrides or fails to relock, which
      # otherwise slips through because no other workflow watches this file.
      - 'package.json'
      - '.github/workflows/security-audit.yml'
      - '.github/actions/setup-node-pnpm/action.yml'
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      # Audits the whole workspace from the single root lockfile. Root
      # pnpm.overrides patch known-vulnerable transitive deps (basic-ftp,
      # protobufjs); keep them in sync with this gate.
      - name: Run security audit
        run: pnpm audit --audit-level critical
        continue-on-error: ${{ github.event_name == 'schedule' }}
