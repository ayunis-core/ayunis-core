name: Dead Code

on:
  pull_request:
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/knip.json'
      - '.github/workflows/dead-code.yml'
      - '.github/actions/setup-node-pnpm/action.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Backend
            working-directory: ayunis-core-backend
            precheck: pnpm run build:deps
          - name: Agent Runtime
            working-directory: packages/agent-runtime
            precheck: ''
          - name: Agent Extensions
            working-directory: packages/agent-extensions
            precheck: ''
          - name: Inference
            working-directory: packages/inference
            precheck: ''
          - name: Provider Anthropic
            working-directory: packages/provider-anthropic
            precheck: ''
          - name: Provider OpenAI
            working-directory: packages/provider-openai
            precheck: ''
          - name: UI Package
            working-directory: packages/ui
            precheck: ''
          - name: Frontend
            working-directory: ayunis-core-frontend
            precheck: ''

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Prepare workspace dependencies
        if: matrix.precheck != ''
        working-directory: ${{ matrix.working-directory }}
        run: ${{ matrix.precheck }}

      - name: Check for dead code
        working-directory: ${{ matrix.working-directory }}
        run: pnpm exec knip --include files,dependencies,unlisted
        continue-on-error: ${{ github.event_name == 'pull_request' }}
