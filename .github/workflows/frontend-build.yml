name: Frontend and UI Build

on:
  pull_request:
    paths:
      - 'ayunis-core-frontend/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-build.yml'
  push:
    branches: [main]
    paths:
      - 'ayunis-core-frontend/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ayunis-core-frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run production build
        run: pnpm run build

      - name: Run linter
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test

      - name: Type-check UI package
        working-directory: packages/ui
        run: pnpm run typecheck

      - name: Lint UI package
        working-directory: packages/ui
        run: pnpm run lint

      - name: Check UI package dependencies
        working-directory: packages/ui
        run: pnpm run deps:check
