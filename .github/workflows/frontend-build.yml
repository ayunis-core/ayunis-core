name: Frontend and UI Build

on:
  pull_request:
    paths:
      - 'ayunis-core-frontend/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-build.yml'
  push:
    branches: [main]
    paths:
      - 'ayunis-core-frontend/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ayunis-core-frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Decide production build coverage
        id: production-build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(mktemp)"
          gh pr diff ${{ github.event.pull_request.number }} --repo "$GITHUB_REPOSITORY" --name-only > "$changed_files"
          if grep -Ev '^(ayunis-core-frontend/(src/.*|public/.*|index\.html$|package\.json$|tsconfig[^/]*\.json$|vite\.config\..*)|packages/ui/.*|pnpm-lock\.yaml$)$' "$changed_files" \
            | grep -Eq '^(ayunis-core-frontend/|packages/ui/|pnpm-lock\.yaml$)'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run TypeScript type check
        run: pnpm exec tsc --noEmit

      - name: Run production build
        if: steps.production-build.outputs.needed == 'true'
        run: pnpm run build

      - name: Run linter
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test

      - name: Type-check UI package
        working-directory: packages/ui
        run: pnpm run typecheck

      - name: Lint UI package
        working-directory: packages/ui
        run: pnpm run lint

      - name: Check UI package dependencies
        working-directory: packages/ui
        run: pnpm run deps:check
