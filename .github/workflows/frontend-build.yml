name: Frontend and UI Build

on:
  pull_request:
    paths:
      - 'ayunis-core-frontend/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/frontend-build.yml'
      - '.github/actions/setup-node-pnpm/action.yml'
  push:
    branches: [main]
    paths:
      - 'ayunis-core-frontend/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The frontend consumes @ayunis/ui from source, so none of these jobs needs
# another's output; they run in parallel instead of one ~3-minute chain.
jobs:
  build:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run production build
        working-directory: ayunis-core-frontend
        run: pnpm run build

  lint:
    name: Frontend lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run linter
        working-directory: ayunis-core-frontend
        run: pnpm run lint

  test:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run tests
        working-directory: ayunis-core-frontend
        run: pnpm run test

  ui-package:
    name: UI package
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/ui

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Type-check UI package
        run: pnpm run typecheck

      - name: Lint UI package
        run: pnpm run lint

      - name: Check UI package dependencies
        run: pnpm run deps:check
