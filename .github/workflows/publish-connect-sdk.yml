name: Publish Connect SDK

on:
  push:
    branches: [codex/ayc-1239-internal-openapi]
    tags: ['connect-sdk-v*']
    paths:
      - 'packages/core-connect-sdk/**'
      - 'contracts/core-connect.openapi.json'
      - '.github/workflows/publish-connect-sdk.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connect-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: '24'
      - run: pnpm --filter @ayunis-core/connect-sdk build
      - run: pnpm --filter @ayunis-core/connect-sdk lint
      - run: pnpm --filter @ayunis-core/connect-sdk typecheck
      - run: pnpm --filter @ayunis-core/connect-sdk test
      - run: pnpm --filter core-backend contracts:fixtures
      - run: pnpm --filter core-backend contracts:openapi
      - run: pnpm --filter @ayunis-core/connect-sdk generate
      - name: Verify generated inputs and output
        run: git diff --exit-code -- contracts/core-connect.openapi.json packages/core-connect-sdk/fixtures/ packages/core-connect-sdk/src/client/generated.ts
      - name: Select immutable release version
        id: version
        shell: bash
        run: |
          base_version=$(node -p "require('./packages/core-connect-sdk/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/connect-sdk-v* ]]; then
            version=${GITHUB_REF_NAME#connect-sdk-v}
            test "$version" = "$base_version"
            tag=latest
          else
            version="$base_version-preview.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
            tag=next
          fi
          npm --prefix packages/core-connect-sdk version "$version" --no-git-tag-version --ignore-scripts --allow-same-version
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: pnpm --filter @ayunis-core/connect-sdk pack --pack-destination "$RUNNER_TEMP/connect-sdk"
      - run: pnpm --filter @ayunis-core/connect-sdk test:package "$RUNNER_TEMP/connect-sdk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: connect-sdk-package
          path: ${{ runner.temp }}/connect-sdk/*.tgz
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@ayunis-core'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: connect-sdk-package
          path: package
      - name: Publish verified package to GitHub Packages
        working-directory: package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_TAG: ${{ needs.package.outputs.tag }}
        run: npm publish ./*.tgz --registry=https://npm.pkg.github.com --tag "$DIST_TAG" --ignore-scripts
