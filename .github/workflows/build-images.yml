name: Build & Publish Images

# Publishes the four Core images to GHCR (AYC-588):
#   ayunis-core-app             — frontend + backend (root Dockerfile)
#   ayunis-core-code-execution  — sandbox orchestrator service
#   ayunis-core-anonymize       — PII anonymization service
#   ayunis-core-python-sandbox  — image user code executes in (DOCKER_IMAGE)
#
# Pushes to main produce sha-<commit> + latest tags (what staging pulls,
# AYC-589); release tags produce vX.Y.Z.
#
# release-please calls this workflow instead of pushing a tag that would
# trigger it: GITHUB_TOKEN-created tags don't fire push-tag workflows, and
# since AYC-589 its deploys pull these images, so the build has to be a real
# `needs:` dependency rather than a fire-and-forget dispatch. The caller's ref
# is then refs/heads/main, not the tag — hence release_tag.
#
# Each image is published as a multi-arch manifest list (AYC-589). This is not
# optional: staging runs aarch64 while internal and production run x86_64, and
# amd64-only images died on staging with `exec format error`. Every leg builds
# on a runner of its own architecture rather than under QEMU — emulating the
# torch/chromium/bcrypt builds would turn a 7-minute job into an hour on every
# push to main. Hosts pull only their own platform, so this costs the boxes
# nothing.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Build this tag instead of the caller's ref, and tag the images with it
        type: string
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  # release_tag, not just github.ref: a release-please call runs with the
  # caller's ref (main) and would otherwise share a group with the build
  # triggered by the very push that created the release — where a third
  # queued run would cancel it.
  group: build-images-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  # Builds one architecture of one image and pushes it by digest — no tags.
  # Tagging happens once per image in `merge`, which binds both digests into a
  # single manifest list. Tagging here instead would leave the two
  # architectures fighting over the same tag.
  build:
    strategy:
      fail-fast: false
      matrix:
        image:
          - ayunis-core-app
          - ayunis-core-code-execution
          - ayunis-core-anonymize
          - ayunis-core-python-sandbox
        platform: [amd64, arm64]
        # Keys here attach to every combination whose `image` matches, so each
        # entry covers both platform legs.
        include:
          - image: ayunis-core-app
            context: .
            dockerfile: Dockerfile
            target: production
          - image: ayunis-core-code-execution
            context: ./ayunis-core-code-execution
            dockerfile: ./ayunis-core-code-execution/Dockerfile
            target: ''
          - image: ayunis-core-anonymize
            context: ./ayunis-core-anonymize
            dockerfile: ./ayunis-core-anonymize/Dockerfile
            target: ''
          - image: ayunis-core-python-sandbox
            context: ./ayunis-core-code-execution/sandbox
            dockerfile: ./ayunis-core-code-execution/sandbox/Dockerfile
            target: ''
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      # github.sha, not github.ref: on the push path the ref's tip may already
      # have moved past the commit whose sha- tag we're about to publish.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.release_tag || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only — the tags this produces are applied in `merge`.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # provenance: false keeps the index children to just the architectures
      # published here — the default attestation manifests add further untagged
      # children on top, cluttering the package view. (The per-architecture
      # children are untagged too and are unavoidable for a manifest list;
      # ghcr-cleanup.yml relies on its pinned action version to spare them.)
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.platform }}
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          # Registry cache rather than type=gha: four images across two
          # platforms export eight mode=max scopes, and the two anonymize layer
          # blobs are ~2.7 GB each — the repo sat at 10.97 GB against GitHub's
          # 10 GB per-repo cache quota. Over quota GitHub evicts LRU, so the
          # 3 GB torch layer got rebuilt under a fresh digest on unpredictable
          # pushes. A new digest means the staging host cannot share layers with
          # the generation it is still running and has to hold two full copies
          # of a 6 GB image, which is what exhausted its disk (AYC-589).
          #
          # Safe against ghcr-cleanup.yml: that workflow only deletes tags
          # matching sha-*, so buildcache-* survives the weekly sweep, and its
          # pinned v3.1.0 spares the child manifests of kept tags. Superseded
          # cache blobs do go untagged and are collected — which is what keeps
          # this from growing without bound.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache-${{ matrix.platform }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache-${{ matrix.platform }},mode=max

      # The filename is the digest; the file itself is empty. `merge` only needs
      # the names.
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.image }}-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Binds each image's per-architecture digests into one tagged manifest list.
  # This is where sha-/latest/vX.Y.Z actually get applied.
  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ayunis-core-app
          - ayunis-core-code-execution
          - ayunis-core-anonymize
          - ayunis-core-python-sandbox
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # latest=false: the default latest=auto also tags :latest on semver
          # builds, which would let a release (or a re-run of an old tag)
          # overwrite the main-branch latest that staging pulls.
          flavor: |
            latest=false
          # A release_tag build runs with the caller's ref (main), so the
          # ref-derived tags are gated off — otherwise it would republish
          # sha-/latest and defeat the latest=false rule above. type=semver
          # still covers a hand-pushed v* tag.
          tags: |
            type=sha,prefix=sha-,enable=${{ inputs.release_tag == '' }}
            type=raw,value=latest,enable=${{ inputs.release_tag == '' && github.ref == 'refs/heads/main' }}
            type=semver,pattern=v{{version}},enable=${{ inputs.release_tag == '' }}
            type=raw,value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          set -e
          # Word splitting is the mechanism here, not an accident: the first
          # substitution expands to one `-t <tag>` pair per tag, the second to
          # one `<image>@sha256:<digest>` argument per digest file.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Verify both architectures are present
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -e
          PLATFORMS=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --raw \
            | jq -r '[.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | sort | join(",")')
          echo "Published platforms: $PLATFORMS"
          if [ "$PLATFORMS" != "linux/amd64,linux/arm64" ]; then
            echo "::error::expected linux/amd64,linux/arm64 — got '$PLATFORMS'"
            exit 1
          fi

  # On a versioned release, ping ayunis-infra so Renovate opens a bump PR for
  # the new image tags within a minute or two. Runs once per tag, not per
  # matrix leg — the listener ignores the payload (pure wake-up), and one
  # dispatch avoids four redundant app-token mints. The token is the shared
  # Ayunis CI app, scoped to ayunis-infra; the app must be installed there
  # and CI_APP_* org secrets shared with this repo.
  notify-infra:
    needs: merge
    # On the release-please path github.ref is main, so the ref check alone
    # would silently stop pinging infra.
    if: ${{ inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Mint ayunis-infra token
        id: infra-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ayunis-core
          repositories: ayunis-infra

      - name: Trigger infra Renovate
        env:
          INFRA_TOKEN: ${{ steps.infra-token.outputs.token }}
          IMAGE: ${{ github.repository }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${INFRA_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ayunis-core/ayunis-infra/dispatches \
            -d "$(jq -nc --arg image "$IMAGE" --arg tag "$TAG" '{event_type:"image-published",client_payload:{image:$image,tag:$tag}}')"
