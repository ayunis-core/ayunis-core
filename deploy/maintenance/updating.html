<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Served by nginx while the app container restarts; reloads the same URL. -->
    <meta http-equiv="refresh" content="5" />
    <meta name="robots" content="noindex" />
    <title>Ayunis wird aktualisiert</title>
    <script>
      // Match the app: light unless the user chose dark (same origin, same key).
      try {
        if (localStorage.getItem('ayunis-theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #0a0a0a;
        --muted: #737373;
        --ring: #e5e5e5;
        --accent: #0a0a0a;
      }
      :root.dark {
        color-scheme: dark;
        --bg: #0a0a0a;
        --fg: #fafafa;
        --muted: #a3a3a3;
        --ring: #262626;
        --accent: #fafafa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        text-align: center;
      }
      .spinner {
        width: 40px;
        height: 40px;
        margin: 0 auto 16px;
        border: 3px solid var(--ring);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.125rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 4px;
        color: var(--muted);
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main role="status">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Ayunis wird aktualisiert</h1>
      <p>Die Seite lädt in wenigen Sekunden automatisch neu.</p>
      <p lang="en">Ayunis is updating. This page will reload automatically.</p>
    </main>
  </body>
</html>
